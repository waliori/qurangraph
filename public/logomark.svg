<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- ayat.network — a girih 8-point star woven into a node network -->
  <g stroke="#f5b301" stroke-width="1.6" stroke-linejoin="round">
    <rect x="11" y="11" width="18" height="18" rx="1.5"/>
    <rect x="11" y="11" width="18" height="18" rx="1.5" transform="rotate(45 20 20)"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.3" opacity="0.85">
    <line x1="20" y1="20" x2="20" y2="4"/>
    <line x1="20" y1="20" x2="34" y2="13"/>
    <line x1="20" y1="20" x2="33" y2="30"/>
    <line x1="20" y1="20" x2="7" y2="30"/>
    <line x1="20" y1="20" x2="6" y2="13"/>
  </g>
  <g fill="#6aa8ff">
    <circle cx="20" cy="4" r="2.6"/>
    <circle cx="34" cy="13" r="2.6"/>
    <circle cx="33" cy="30" r="2.6"/>
    <circle cx="7" cy="30" r="2.6"/>
    <circle cx="6" cy="13" r="2.6"/>
  </g>
  <circle cx="20" cy="20" r="4" fill="#fcd34d"/>
</svg>
