# Security headers, included into the server + every location. They live in a separate
# snippet (NOT under conf.d/, which nginx auto-loads as server blocks) and are re-included
# per location because nginx's add_header does NOT inherit into a location that defines
# any add_header of its own — so each block must restate them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Clickjacking defence the build-time <meta> CSP can't express (frame-ancestors is
# ignored in a meta tag). The full content policy stays in the meta tag (vite.config.js).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# HSTS belongs at the TLS terminator (this server listens on :80, TLS terminated
# upstream). Enable there, e.g.:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
