# Security headers, included into the server + every location. They live in a separate
# snippet (NOT under conf.d/, which nginx auto-loads as server blocks) and are re-included
# per location because nginx's add_header does NOT inherit into a location that defines
# any add_header of its own — so each block must restate them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Framing is intentionally OPEN to any origin so the tool can be embedded (iframe)
# on third-party sites (researchers' pages, etc.). Safe here: the app is public and
# read-only — no login, cookies, or sensitive actions — and cross-site iframes get
# partitioned storage, so there's no clickjacking surface. We therefore send NO
# X-Frame-Options and NO `frame-ancestors` restriction. (The full content policy —
# script-src, connect-src, … — stays in the build-time <meta> CSP in vite.config.js;
# frame-ancestors is ignored in a meta tag, which is why nothing here restricts it.)
# HSTS belongs at the TLS terminator (this server listens on :80, TLS terminated
# upstream). Enable there, e.g.:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
