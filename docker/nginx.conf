server {
  listen       80;
  listen       [::]:80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  include /etc/nginx/security-headers.conf;

  # Serve pre-compressed *.gz siblings (written at build time, see vite.config.js)
  # instead of recompressing on every request. Falls back to on-the-fly gzip for
  # anything without a precompressed twin.
  gzip_static     on;
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_types      application/json application/javascript text/css image/svg+xml application/manifest+json;

  # Fingerprinted build assets — safe to cache forever.
  location /assets/ {
    include    /etc/nginx/security-headers.conf;
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # Precomputed corpus data — revalidate hourly.
  location /data/ {
    include    /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files  $uri =404;
  }

  # Free-tier assistant API → the ai-proxy container (see docker-compose.yml). The responses
  # are Server-Sent Events, so buffering/caching are OFF and read timeout is generous so token
  # streams aren't cut. Resolving the upstream via Docker's embedded DNS (127.0.0.11) through a
  # variable defers the lookup to request time, so nginx still boots if ai-proxy is briefly down
  # (a request then gets 502 instead of nginx failing to start). BYOK requests never come here —
  # the browser calls the provider directly for those.
  location /api/ {
    include   /etc/nginx/security-headers.conf;
    resolver  127.0.0.11 valid=30s ipv6=off;
    set       $ai_upstream http://ai-proxy:8080;
    proxy_pass $ai_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding off;
  }

  # The service worker must always be revalidated — a stale sw.js would keep
  # serving an old cached app across deploys.
  location = /sw.js {
    include   /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA-style fallback (single page; no hard 404s for unknown paths). The entry
  # point (index.html, served here and for every client-side route) is marked
  # no-cache so a new deploy's freshly-fingerprinted bundle is picked up at once,
  # instead of the browser reusing a cached index that points at old assets.
  location / {
    include   /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
