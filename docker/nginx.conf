server {
  listen       80;
  listen       [::]:80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  include /etc/nginx/security-headers.conf;

  # Serve pre-compressed *.gz siblings (written at build time, see vite.config.js)
  # instead of recompressing on every request. Falls back to on-the-fly gzip for
  # anything without a precompressed twin.
  gzip_static     on;
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_types      application/json application/javascript text/css image/svg+xml application/manifest+json;

  # ── The HTTP API (a separate container; see docker-compose.yml) ──
  #
  # The upstream is resolved per REQUEST through Docker's embedded DNS rather than once
  # at startup. With a literal `proxy_pass http://name`, nginx refuses to start while
  # that container is down — so an API restart (or a first `up` where the API is slower
  # to become healthy) would take the whole site with it. Putting the host in a variable
  # forces runtime resolution; `$request_uri` is then required because a variable
  # proxy_pass no longer passes the matched URI through on its own.
  location /api/ {
    include /etc/nginx/security-headers.conf;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream "qurangraph-api:8080";

    # The MCP endpoint (POST /api/v1/mcp) is the only thing on this API with a request
    # BODY, and it enforces its own 1 MB ceiling (API_MCP_MAX_BODY) — refusing an
    # oversized body while it streams and answering in the API's own JSON error shape.
    # nginx's default client_max_body_size is also 1m, which would mean an oversized
    # request is rejected HERE first, with nginx's HTML 413 that no JSON-RPC client can
    # parse. Leave a little headroom so the application is what says no.
    client_max_body_size 2m;
    proxy_pass         http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    # The API sets its own Cache-Control/ETag per endpoint; don't add a second one.
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  # A hand-typed /api lands on the current version rather than the SPA fallback.
  # absolute_redirect off → a RELATIVE Location, so the browser keeps the scheme, host
  # and port it actually used. An absolute one would be rebuilt from this server block
  # and come back as http://localhost/… — losing :8088 locally, and https:// in
  # production (TLS is terminated upstream at the proxy).
  location = /api {
    absolute_redirect off;
    return 302 /api/v1/;
  }

  # The API container is down: answer in the API's own error shape so a client parses it.
  location @api_unavailable {
    include        /etc/nginx/security-headers.conf;
    default_type   application/json;
    add_header     Cache-Control "no-store" always;
    add_header     Access-Control-Allow-Origin "*" always;
    return 503 '{"error":{"code":"service_unavailable","message":"The API is restarting. Try again shortly."}}';
  }

  # ── MCP authorization discovery ──
  #
  # Before connecting, an MCP client asks whether the server is OAuth-protected: it probes
  # /.well-known/oauth-protected-resource (RFC 9728, optionally with the resource path
  # appended), /.well-known/oauth-authorization-server, and sometimes the OpenID document.
  #
  # Without this block those paths match no location, fall through to the SPA fallback at
  # the bottom of this file, and are answered `200 text/html` with index.html. The client
  # then tries to parse a web page as authorization metadata, fails, and tells the user it
  # "couldn't register with ayat.network's sign-in service" — naming a sign-in service that
  # does not exist, for an API that needs no key.
  #
  # /api/v1/mcp requires no authorization, and the way to say so is a clean 404: the ABSENCE
  # of metadata is what tells a client to connect anonymously. Answer in JSON so a client
  # that reads the body before the status still gets something it can parse.
  #
  # (If API_KEYS is ever turned on, this is where real Protected Resource Metadata would go —
  # the key mechanism is not OAuth, so an MCP client would need the key injected as a header.)
  location ~ ^/\.well-known/(oauth-|openid-) {
    include      /etc/nginx/security-headers.conf;
    default_type application/json;
    add_header   Cache-Control "no-store" always;
    add_header   Access-Control-Allow-Origin "*" always;
    return 404 '{"error":{"code":"not_found","message":"This MCP endpoint requires no authorization, so it publishes no OAuth metadata. Connect to /api/v1/mcp directly."}}';
  }

  # The other half of that probe. MCP's 2025-03-26 authorization revision says that a client
  # which finds NO authorization-server metadata must fall back to fixed default paths on the
  # issuer — /authorize, /token, /register — and try Dynamic Client Registration there. So the
  # clean 404 above does not end the conversation: the client then POSTs to /register.
  #
  # Under the SPA fallback that POST is answered `200 text/html` with index.html. The client
  # reads a successful registration that it cannot parse, and reports that it "couldn't
  # register with ayat.network's sign-in service" — inventing a broken sign-in service out of
  # a web page. A 404 here is unambiguous: there is no registration endpoint, because there is
  # nothing to register with.
  location ~ ^/(authorize|token|register)$ {
    include      /etc/nginx/security-headers.conf;
    default_type application/json;
    add_header   Cache-Control "no-store" always;
    add_header   Access-Control-Allow-Origin "*" always;
    return 404 '{"error":{"code":"not_found","message":"This server runs no OAuth authorization server. /api/v1/mcp needs no client registration and no token — connect to it anonymously."}}';
  }

  # Fingerprinted build assets — safe to cache forever.
  location /assets/ {
    include    /etc/nginx/security-headers.conf;
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # Precomputed corpus data — revalidate hourly.
  location /data/ {
    include    /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files  $uri =404;
  }

  # Demo clips for the What's New log and the help guide. A MISSING clip must 404 rather
  # than fall through to the SPA below: the changelog deliberately ships an entry before
  # its clip is filmed and relies on the player dropping a figure whose source fails
  # (src/components/ClipMedia.jsx). Handing back index.html with a 200 defeats that — the
  # browser sees a successful response it can't decode, and leaves an empty box.
  location /changelog/ {
    include    /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files  $uri =404;
  }

  # The service worker must always be revalidated — a stale sw.js would keep
  # serving an old cached app across deploys.
  location = /sw.js {
    include   /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA-style fallback (single page; no hard 404s for unknown paths). The entry
  # point (index.html, served here and for every client-side route) is marked
  # no-cache so a new deploy's freshly-fingerprinted bundle is picked up at once,
  # instead of the browser reusing a cached index that points at old assets.
  location / {
    include   /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
