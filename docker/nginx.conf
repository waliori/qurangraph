server {
  listen       80;
  listen       [::]:80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # gzip the text-y, compressible payloads (the data JSON is large).
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_types      application/json application/javascript text/css image/svg+xml application/manifest+json;

  # Fingerprinted build assets — safe to cache forever.
  location /assets/ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # Precomputed corpus data — revalidate hourly.
  location /data/ {
    add_header Cache-Control "public, max-age=3600";
    try_files  $uri =404;
  }

  # SPA-style fallback (single page; no hard 404s for unknown paths).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
