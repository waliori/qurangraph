name: CI

on:
  push:
    branches: [main, simple-graph]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Builds the production image end-to-end: this is the only thing that exercises
  # the Dockerfile's data-reconstruction stage (Tanzil → JSON, morphology → roots,
  # lexicons), so a break there is caught here rather than at deploy time.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qurangraph:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
